      lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>',
      link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>',
      zap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2"/></svg>',
      settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
      heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>',
      phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>',
      shopping: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>',
      image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>',
    };

    // --- CLOCK ---
    function updateClock() {
      const now = new Date();
      const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
      const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      document.getElementById('headerDate').textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
      const h = now.getHours(), m = String(now.getMinutes()).padStart(2,'0'), s = String(now.getSeconds()).padStart(2,'0');
      const ampm = h >= 12 ? 'PM' : 'AM', h12 = h % 12 || 12;
      document.getElementById('headerTime').textContent = String(h12).padStart(2,'0') + ':' + m + ':' + s + ' ' + ampm;
    }
    updateClock(); setInterval(updateClock, 1000);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
          const resp = await fetch('https://nominatim.openstreetmap.org/reverse?lat='+pos.coords.latitude+'&lon='+pos.coords.longitude+'&format=json');
          const data = await resp.json();
          const city = data.address.city || data.address.town || data.address.village || '';
          const country = data.address.country || '';
          if (city || country) document.getElementById('headerLocation').textContent = [city, country].filter(Boolean).join(', ');
        } catch(e) {}
      });
    }

    // --- SUPABASE CRUD ---
    let allLinks = [];
    let editingId = null;
    let addingSection = null;
    const SECTION_ORDER = ['OPERATIONS', 'MARKETING', 'FINANCE', 'DEVELOPMENT'];

    async function loadLinks() {
      const { data, error } = await sb.from('dashboard_links').select('*').order('sort_order', { ascending: true });
      if (error) { console.error(error); return; }
      allLinks = data || [];
      render();
    }

    function render(filter) {
      const container = document.getElementById('sections');
      const lf = (filter || '').toLowerCase();
      let html = '';
      SECTION_ORDER.forEach(sec => {
        let links = allLinks.filter(l => l.section === sec);
        if (lf) links = links.filter(l => l.name.toLowerCase().includes(lf) || l.type.toLowerCase().includes(lf));
        if (links.length === 0 && lf) return;
        html += '<div class="section"><div class="section-title">' + sec + '</div>';
        const secLinks = lf ? links : allLinks.filter(l => l.section === sec);
        secLinks.forEach((link, idx) => {
          let href = link.url && link.url !== '#' ? link.url : '#';
          if (href !== '#' && !href.match(/^https?:\/\//i)) href = 'https://' + href;
          const target = href !== '#' ? ' target="_blank"' : '';
          const upBtn = idx > 0 ? '<button class="action-btn" onclick="event.preventDefault();event.stopPropagation();moveLink(\'' + link.id + '\',-1)" title="Move up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18,15 12,9 6,15"/></svg></button>' : '';
          const downBtn = idx < secLinks.length - 1 ? '<button class="action-btn" onclick="event.preventDefault();event.stopPropagation();moveLink(\'' + link.id + '\',1)" title="Move down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,9 12,15 18,9"/></svg></button>' : '';
          html += '<a href="' + href + '"' + target + ' class="link-row" onclick="handleRowClick(event,\'' + link.id + '\')">' +
            '<div class="link-row-left"><span class="link-icon">' + (icons[link.icon] || icons.document) + '</span><span class="link-name">' + link.name + '</span></div>' +
            '<div class="link-actions">' + upBtn + downBtn + '<button class="action-btn" onclick="event.preventDefault();event.stopPropagation();openEdit(\'' + link.id + '\')">Edit</button>' +
            '<button class="action-btn delete" onclick="event.preventDefault();event.stopPropagation();deleteLink(\'' + link.id + '\')">Delete</button></div>' +
            '<span class="link-type">' + link.type + '</span></a>';
        });
        if (!lf) {
          html += '<div class="add-link" onclick="openAdd(\'' + sec + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> ADD LINK</div>';
        }
        html += '</div>';
      });
      container.innerHTML = html;
    }

    function handleRowClick(e, id) {
      const link = allLinks.find(l => l.id === id);
      if (!link || !link.url || link.url === '#') e.preventDefault();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => render(e.target.value));

    let selectedIcon = 'document';

    function buildIconPicker(currentIcon) {
      const picker = document.getElementById('iconPicker');
      selectedIcon = currentIcon || 'document';
      picker.innerHTML = '';
      Object.keys(icons).forEach(key => {
        const opt = document.createElement('div');
        opt.className = 'icon-option' + (key === selectedIcon ? ' selected' : '');
        opt.innerHTML = icons[key];
        opt.title = key;
        opt.onclick = () => {
          picker.querySelectorAll('.icon-option').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          selectedIcon = key;
        };
        picker.appendChild(opt);
      });
    }

    function openEdit(id) {
      editingId = id; addingSection = null;
      const link = allLinks.find(l => l.id === id);
      document.getElementById('modalTitle').textContent = 'Edit Link';
      document.getElementById('editName').value = link.name;
      document.getElementById('editUrl').value = link.url;
      document.getElementById('editType').value = link.type;
      buildIconPicker(link.icon);
      document.getElementById('editOverlay').classList.add('active');
    }

    function openAdd(section) {
      editingId = null; addingSection = section;
      document.getElementById('modalTitle').textContent = 'Add Link';
      document.getElementById('editName').value = '';
      document.getElementById('editUrl').value = '#';
      document.getElementById('editType').value = '';
      buildIconPicker('document');
      document.getElementById('editOverlay').classList.add('active');
    }

    function closeModal() { document.getElementById('editOverlay').classList.remove('active'); }

    async function saveEdit() {
      const name = document.getElementById('editName').value.trim();
      const url = document.getElementById('editUrl').value.trim() || '#';
      const type = document.getElementById('editType').value.trim().toUpperCase();
      if (!name) return;
      const icon = selectedIcon || 'document';
      if (addingSection) {
        const maxSort = allLinks.filter(l => l.section === addingSection).reduce((m, l) => Math.max(m, l.sort_order || 0), -1);
        await sb.from('dashboard_links').insert({ section: addingSection, name, url, type, icon, sort_order: maxSort + 1 });
      } else if (editingId) {
        await sb.from('dashboard_links').update({ name, url, type, icon, updated_at: new Date().toISOString() }).eq('id', editingId);
      }
      closeModal();
      await loadLinks();
    }

    async function deleteLink(id) {
      await sb.from('dashboard_links').delete().eq('id', id);
      await loadLinks();
    }

    async function moveLink(id, direction) {
      const link = allLinks.find(l => l.id === id);
      if (!link) return;
      const secLinks = allLinks.filter(l => l.section === link.section);
      const idx = secLinks.findIndex(l => l.id === id);
      const swapIdx = idx + direction;
      if (swapIdx < 0 || swapIdx >= secLinks.length) return;
      const other = secLinks[swapIdx];
      const tempOrder = link.sort_order;
      await sb.from('dashboard_links').update({ sort_order: other.sort_order }).eq('id', link.id);
      await sb.from('dashboard_links').update({ sort_order: tempOrder }).eq('id', other.id);
      await loadLinks();
    }

    document.getElementById('editOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
